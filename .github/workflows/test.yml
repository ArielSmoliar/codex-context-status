name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20'
            python: '3.10'
          - node: '22'
            python: '3.12'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix mcp --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Check generated inspector
        run: git diff --exit-code -- mcp/inspector.html
      - run: npm test
      - run: npm run test:landing
      - name: Synthetic benchmark smoke check
        run: npm run benchmark -- --sizes-mib 1 --repeats 1
